name: AI create pull request

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: github.event.label.name == (vars.AI_CREATE_PR_LABEL || 'ai-create-pr')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AI_ALLOWED_USERS: ${{ vars.AI_ALLOWED_USERS || secrets.AI_ALLOWED_USERS }}
      AI_CREATE_PR_LABEL: ${{ vars.AI_CREATE_PR_LABEL || 'ai-create-pr' }}
      DEFAULT_BRANCH: ${{ vars.AI_DEFAULT_BRANCH || github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate request and locate implementation branch
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json labels,comments,author)"
          labels="$(python3 -c 'import json,sys; print(" ".join(x["name"] for x in json.load(sys.stdin)["labels"]))' <<<"$issue_json")"
          allowed=",${AI_ALLOWED_USERS:-},"
          if [[ "$allowed" != *",${{ github.actor }},"* ]]; then
            echo "The triggering user is not in AI_ALLOWED_USERS."
            exit 1
          fi
          if [[ "$labels" != *"$AI_CREATE_PR_LABEL"* ]]; then
            echo "The create-PR label is no longer present."
            exit 1
          fi
          if ! grep -Fq '<!-- ai-requirements-clear -->' < <(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json comments --jq '.comments[].body'); then
            echo "Requirements have not been marked clear; refusing to create a PR."
            exit 1
          fi
          branch="ai/issue-${ISSUE_NUMBER}"
          if ! gh api "repos/$REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Implementation branch $branch does not exist."
            exit 1
          fi
          existing_pr="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state all --json url --jq '.[0].url')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Create pull request from existing branch
        id: pr
        if: steps.validate.outputs.existing_pr == ''
        env:
          BRANCH: ${{ steps.validate.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr create --repo "$REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "AI implementation for issue #$ISSUE_NUMBER" \
            --body $'Implemented from issue #'"$ISSUE_NUMBER"$'\n\nCloses #'"$ISSUE_NUMBER")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Announce and remove create-PR label
        if: success()
        env:
          EXISTING_PR: ${{ steps.validate.outputs.existing_pr }}
          CREATED_PR: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          pr_url="${CREATED_PR:-$EXISTING_PR}"
          body=$(cat <<EOF
          ## Pull request ready

          $pr_url
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$body"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$AI_CREATE_PR_LABEL"
