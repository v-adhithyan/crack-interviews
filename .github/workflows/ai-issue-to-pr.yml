name: AI issue to pull request

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to implement
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  implement:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-ready-to-implement')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AI_ALLOWED_USERS: ${{ secrets.AI_ALLOWED_USERS || vars.AI_ALLOWED_USERS }}
      AI_TRIGGER_ACTOR: ${{ github.actor }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
    steps:
      - name: Check approval allowlist
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(gh issue view "$ISSUE_NUMBER" --json number,title,body,author,labels,comments)"
          labels="$(python3 -c 'import json,sys; print(" ".join(x["name"] for x in json.load(sys.stdin)["labels"]))' <<<"$issue_json")"
          comments="$(python3 -c 'import json,sys; print("\n".join(x["body"] for x in json.load(sys.stdin)["comments"]))' <<<"$issue_json")"
          allowed="$(printf '%s' ",${AI_ALLOWED_USERS:-}," | tr -d '[:space:]')"
          if [[ "$labels" != *"ai-ready-to-implement"* ]]; then
            echo "Issue is not marked ai-ready-to-implement."
            exit 1
          fi
          if ! grep -Fq '<!-- ai-requirements-clear -->' <<<"$comments"; then
            echo "Requirements have not been marked clear; refusing implementation."
            exit 1
          fi
          if [[ "$allowed" != *",$AI_TRIGGER_ACTOR,"* ]]; then
            echo "The triggering user is not in AI_ALLOWED_USERS."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements_dev.txt
          npm ci --prefix frontend

      - name: Run OpenAI Codex implementation agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Implement GitHub issue #${{ inputs.issue_number || github.event.issue.number }}.

            Follow this exact process:
            1. Read AGENTS.md and .github/AI_SDLC.md.
            2. Read the complete issue, including clarification comments and the requirements-clear comment.
            3. Inspect the existing architecture and relevant tests before editing.
            4. Create a focused branch for this issue and make the smallest complete implementation.
            5. Add or update meaningful unit, integration, and regression tests.
            6. Run all applicable checks from AGENTS.md. Fix failures caused by this change.
            7. For UI changes, add browser coverage and attach before/after screenshots to the pull request when possible.
            8. Do not change secrets, production data, deployment credentials, or unrelated files.
            9. Do not merge or deploy. Open a pull request targeting the default branch.

            The pull request must include:
            - A concise summary of behavior changed.
            - The requirements implemented.
            - Tests and checks run with their results.
            - Risks, limitations, and any follow-up work.
            - A link closing the issue.

            If requirements are still ambiguous, stop without editing code and comment on the issue with the exact missing decisions.
