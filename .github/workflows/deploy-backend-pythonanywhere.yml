name: Deploy backend to PythonAnywhere

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-pythonanywhere.yml"

concurrency:
  group: pythonanywhere-backend-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and generate release notes
        id: release
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_AFTER: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Release metadata changes must never create another release. On a
          # On a push, only backend or frontend changes are release-worthy. The
          # release PR contains neither, so it cannot recursively create one.
          if [[ "$RELEASE_EVENT" == "push" ]]; then
            before="$RELEASE_BEFORE"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="$(git rev-list --max-parents=0 "$RELEASE_AFTER")"
            fi
            if ! git diff --quiet "$before" "$RELEASE_AFTER" -- backend/ frontend/; then
              :
            else
              echo "No backend changes; skipping release metadata PR."
              exit 0
            fi
          fi

          python3 .github/scripts/bump_release.py

          if git diff --quiet -- VERSION RELEASE_NOTES.md; then
            echo "No release metadata changes needed."
            exit 0
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          release_branch="automation/release-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION RELEASE_NOTES.md
          git commit -m "chore(release): v${version}"
          git push origin "HEAD:${release_branch}"

          existing_pr="$(gh pr list --base main --head "${release_branch}" --state open --json number --jq '.[0].number')"
          if [[ -z "$existing_pr" ]]; then
            existing_pr="$(gh pr create \
              --base main \
              --head "${release_branch}" \
              --title "chore(release): v${version}" \
              --body "Automated release metadata for v${version}. Merge this PR to publish the version and release notes.")"
          else
            echo "Release PR #${existing_pr} already exists."
          fi
          echo "pr_number=${existing_pr##*/}" >> "$GITHUB_OUTPUT"

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi

          changed_files="$(git diff --name-only "$before" "$after" -- backend/ || true)"

          {
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
            if echo "$changed_files" | grep -Eq '^backend/requirements(_dev)?\.txt$'; then
              echo "install_requirements=true"
            else
              echo "install_requirements=false"
            fi
            if echo "$changed_files" | grep -Eq '^backend/.*/migrations/[^/]+\.py$'; then
              echo "run_migrations=true"
            else
              echo "run_migrations=false"
            fi
            if [[ -n "$changed_files" ]]; then
              echo "backend_changed=true"
            else
              echo "backend_changed=false"
            fi
            frontend_files="$(git diff --name-only "$before" "$after" -- frontend/ || true)"
            if [[ -n "$frontend_files" ]]; then
              echo "frontend_changed=true"
            else
              echo "frontend_changed=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Summarize deployment scope
        shell: bash
        run: |
          {
            echo "### Deployment scope"
            if [[ "${{ steps.changes.outputs.backend_changed }}" == "true" ]]; then
              echo "- Backend changes detected: PythonAnywhere deployment will run."
            fi
            if [[ "${{ steps.changes.outputs.frontend_changed }}" == "true" ]]; then
              echo "- Frontend changes detected: the configured Vercel deployment will run."
            fi
            if [[ "${{ steps.changes.outputs.backend_changed }}" != "true" && "${{ steps.changes.outputs.frontend_changed }}" != "true" ]]; then
              echo "- No frontend or backend changes detected; deployment is skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        if: steps.changes.outputs.backend_changed == 'true'
        shell: bash
        env:
          PYTHONANYWHERE_SSH_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
          PYTHONANYWHERE_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PYTHONANYWHERE_SSH_KEY" > ~/.ssh/pythonanywhere_deploy_key
          chmod 600 ~/.ssh/pythonanywhere_deploy_key
          ssh-keyscan -H "$PYTHONANYWHERE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on PythonAnywhere
        if: steps.changes.outputs.backend_changed == 'true'
        shell: bash
        env:
          PYTHONANYWHERE_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
          PYTHONANYWHERE_USER: ${{ secrets.PYTHONANYWHERE_USER }}
          PYTHONANYWHERE_VENV: ${{ secrets.PYTHONANYWHERE_VENV }}
          INSTALL_REQUIREMENTS: ${{ steps.changes.outputs.install_requirements }}
          RUN_MIGRATIONS: ${{ steps.changes.outputs.run_migrations }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/pythonanywhere_deploy_key \
            "$PYTHONANYWHERE_USER@$PYTHONANYWHERE_HOST" \
            "INSTALL_REQUIREMENTS='$INSTALL_REQUIREMENTS' RUN_MIGRATIONS='$RUN_MIGRATIONS' PYTHONANYWHERE_VENV='${PYTHONANYWHERE_VENV:-hackerleap.pythonanywhere.com}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd /home/hackerleap/hackerleap.pythonanywhere.com

          if [[ -f /usr/local/bin/virtualenvwrapper.sh ]]; then
            set +u
            source /usr/local/bin/virtualenvwrapper.sh
            workon "$PYTHONANYWHERE_VENV"
            set -u
          else
            source ~/.virtualenvs/"$PYTHONANYWHERE_VENV"/bin/activate
          fi

          git pull origin main

          cd backend

          if [[ "$INSTALL_REQUIREMENTS" == "true" ]]; then
            pip install -r requirements_dev.txt
          fi

          # Always run migrations. They are idempotent, and this prevents a
          # schema repair from being skipped when deploy commits are rebased,
          # manually dispatched, or compared across an incomplete push range.
          # Also removes the retired product-scale column/migration record.
          # This must run after pulling the reverted model and before migrate.
          python manage.py repair_mock_interview_schema
          python manage.py migrate --noinput

          python manage.py shell -c "from django.db import connection; table='product_mock_interview_session'; cursor=connection.cursor(); columns={column.name for column in connection.introspection.get_table_description(cursor, table)}; cursor.close(); assert 'share_uuid' not in columns, 'Stale share_uuid column still exists'; assert 'track' not in columns, 'Retired product-scale track column still exists'"

          # Production uses WhiteNoise's manifest storage. Rebuild the manifest
          # on every deploy so templates never reference a missing hashed asset.
          python manage.py collectstatic --noinput
          REMOTE_SCRIPT

      - name: Reload PythonAnywhere web app
        if: steps.changes.outputs.backend_changed == 'true'
        uses: jensvog/pythonanywhere-webapp-reload-action@v1
        with:
          host: ${{ secrets.PYTHONANYWHERE_API_HOST || 'www.pythonanywhere.com' }}
          username: ${{ secrets.PYTHONANYWHERE_USER }}
          api-token: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          domain-name: ${{ secrets.PYTHONANYWHERE_DOMAIN_NAME }}

      - name: Enable automatic merge for release PR
        if: success() && steps.release.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh pr merge "${{ steps.release.outputs.pr_number }}" --squash --auto; then
            echo "Release PR could not be queued for auto-merge; leaving it open for review."
          fi
