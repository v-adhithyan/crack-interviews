<aside id="product-sidebar" class="product-sidebar" aria-label="Product navigation">
    <div class="sidebar-header">
        {% include "product/includes/brand.html" %}
        <button class="sidebar-close" type="button" aria-label="Close navigation menu" data-menu-close>&times;</button>
    </div>
    <nav class="product-nav" aria-label="Dashboard">
        <a class="{% if active_nav == 'dashboard' %}active{% endif %}" href="{% url 'product_dashboard' %}">
            <span aria-hidden="true">⌂</span>
            <span>Dashboard</span>
        </a>
        <a href="{% if resume %}{% url 'resume_content' resume_uuid=resume.uuid %}{% else %}{% url 'product_dashboard' %}{% endif %}" {% if resume %}target="_blank" rel="noopener"{% endif %}>
            <span aria-hidden="true">▧</span>
            <span>Resume</span>
        </a>
        <a class="{% if active_nav == 'analysis_history' %}active{% endif %}" href="{% url 'analysis_history' %}">
            <span aria-hidden="true">◷</span>
            <span>Analysis History</span>
        </a>
        {% if request.user.is_staff %}
        <a class="{% if active_nav == 'quick_refresh' %}active{% endif %}" href="{% url 'quick_refresh' %}">
            <span aria-hidden="true">✎</span>
            <span>Quick Refresh</span>
        </a>
        {% endif %}
<!--        <a href="{% url 'product_dashboard' %}">-->
<!--            <span aria-hidden="true">⚙</span>-->
<!--            <span>Settings</span>-->
<!--        </a>-->
    </nav>
    <div class="beta-card">
        <strong>Closed Beta</strong>
        <p>You're early! Thanks for being a part of HackerLeap.</p>
        <a href="mailto:adhi@hackerleap.com">Share Feedback</a>
    </div>
</aside>
