<aside id="product-sidebar" class="product-sidebar" aria-label="Product navigation">
    <div class="sidebar-header">
        {% include "product/includes/brand.html" %}
        <button class="sidebar-close" type="button" aria-label="Close navigation menu" data-menu-close>&times;</button>
    </div>
    <nav class="product-nav" aria-label="Dashboard">
        <a class="{% if active_nav == 'dashboard' %}active{% endif %}" href="{% url 'product_dashboard' %}">
            <span aria-hidden="true">⌂</span>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'code_platform_redirect' %}">
            <span aria-hidden="true">⌁</span>
            <span>Code</span>
        </a>
        <a href="{% if resume %}{% url 'resume_content' resume_uuid=resume.uuid %}{% else %}{% url 'current_resume_content' %}{% endif %}" {% if resume %}target="_blank" rel="noopener"{% endif %}>
            <span aria-hidden="true">▧</span>
            <span>Resume</span>
        </a>
        <a class="{% if active_nav == 'resume_builder' %}active{% endif %}" href="{% url 'resume_builder_list' %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h7M14 2v6h6M14 2l6 6v3" />
                <path d="M8 12h5M8 16h2M16 21l-3 1 1-3 6-6a1.4 1.4 0 0 1 2 2l-6 6Z" />
            </svg>
            <span>Resume Builder</span>
        </a>
        <a class="{% if active_nav == 'analysis_history' %}active{% endif %}" href="{% url 'analysis_history' %}">
            <span aria-hidden="true">◷</span>
            <span>Analysis History</span>
        </a>
        <a class="{% if active_nav == 'mock_interview' %}active{% endif %}" href="{% url 'mock_interview_start' %}">
            <span aria-hidden="true">◉</span>
            <span>Mock Interview</span>
        </a>
        <a class="{% if active_nav == 'mock_interview_history' %}active{% endif %}" href="{% url 'mock_interview_history' %}">
            <span aria-hidden="true">▤</span>
            <span>Interview History</span>
        </a>
<!--        <a href="{% url 'product_dashboard' %}">-->
<!--            <span aria-hidden="true">⚙</span>-->
<!--            <span>Settings</span>-->
<!--        </a>-->
    </nav>
    <div class="beta-card">
        <strong>HackerLeap</strong>
        <p>You're early! Thanks for being a part of HackerLeap.</p>
        <a href="mailto:adhi@hackerleap.com">Share Feedback</a>
    </div>
</aside>
