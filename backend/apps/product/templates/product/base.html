{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffc400">
    <title>{% block title %}HackerLeap App{% endblock %}</title>
    <link rel="icon" href="{% static 'website/images/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'product/css/product.css' %}">
</head>
<body class="product-body">
    {% if messages %}
        <div class="product-toast-stack" role="status" aria-live="polite" aria-atomic="true">
            {% for message in messages %}
                <div class="product-toast product-toast-{{ message.tags|default:'info' }}">
                    <span>{{ message }}</span>
                    <button class="product-toast-close" type="button" aria-label="Dismiss notification">&times;</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block body %}{% endblock %}
    <script>
        document.querySelectorAll(".product-toast-close").forEach(function (button) {
            button.addEventListener("click", function () {
                var toast = button.closest(".product-toast");
                if (toast) {
                    toast.remove();
                }
            });
        });

        var menuToggle = document.querySelector("[data-menu-toggle]");
        var menuClose = document.querySelector("[data-menu-close]");
        var setMenuOpen = function (isOpen) {
            document.body.classList.toggle("mobile-nav-open", isOpen);
            if (menuToggle) {
                menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            }
        };
        if (menuToggle) {
            menuToggle.addEventListener("click", function () {
                setMenuOpen(!document.body.classList.contains("mobile-nav-open"));
            });
        }
        if (menuClose) {
            menuClose.addEventListener("click", function () {
                setMenuOpen(false);
            });
        }
        document.querySelectorAll(".product-sidebar a").forEach(function (link) {
            link.addEventListener("click", function () {
                setMenuOpen(false);
            });
        });
        document.addEventListener("click", function (event) {
            document.querySelectorAll(".user-menu[open]").forEach(function (menu) {
                if (!menu.contains(event.target)) {
                    menu.removeAttribute("open");
                }
            });
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                setMenuOpen(false);
                document.querySelectorAll(".user-menu[open]").forEach(function (menu) {
                    menu.removeAttribute("open");
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
